<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — CTF Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/theme.css" />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <span class="brand">CTF Platform</span>
      <span class="service-tag">auth.svc</span>
    </header>
    <main>
      <div class="panel">
        <h1>Sign in</h1>
        <p class="subtitle">Enter your credentials to continue.</p>
        <div id="message" class="message"></div>
        <form id="login-form">
          <label>
            Email
            <input type="email" name="email" required autocomplete="email" />
          </label>
          <label>
            Password
            <input type="password" name="password" required autocomplete="current-password" />
          </label>
          <button type="submit">Sign in</button>
        </form>
        <p class="footnote">No account yet? <a href="/register.html">Create one</a></p>
      </div>
    </main>

    <script type="module">
      import { apiFetch, saveTokens, showMessage, redirectIfAuthed } from '/app.js';

      redirectIfAuthed();

      const form = document.getElementById('login-form');
      const message = document.getElementById('message');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const button = form.querySelector('button');
        button.disabled = true;

        const email = form.email.value.trim();
        const password = form.password.value;

        try {
          const { accessToken, refreshToken } = await apiFetch('/login', {
            method: 'POST',
            body: JSON.stringify({ email, password }),
          });
          saveTokens({ accessToken, refreshToken });
          window.location.href = '/profile.html';
        } catch (err) {
          showMessage(message, err.message, 'error');
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
